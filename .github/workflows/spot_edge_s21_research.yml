name: SPOT EDGE S2.1 - Research Engine Verified

on:
  push:
    branches: [feature/spot-edge-s2-1]
    paths:
      - 'SPOT_EDGE_S2_INDICATOR_RESEARCH/.run_smoke_s21'
      - 'SPOT_EDGE_S2_INDICATOR_RESEARCH/.run_full_s21'
  workflow_dispatch:
    inputs:
      max_symbols:
        description: "0 = universo completo. Usar un numero bajo para pruebas rapidas."
        required: false
        default: "0"
      max_runtime_minutes:
        description: "0 = sin limite por fase. Si se excede, guarda resultados parciales."
        required: false
        default: "330"
      run_phase_b:
        description: "Ejecutar tambien la Fase B (periodo historico adicional)"
        required: false
        default: "true"

concurrency:
  group: spot-edge-s21-research
  cancel-in-progress: false

jobs:
  smoke-test:
    name: Prueba pequena (smoke test) antes de la corrida completa
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: SPOT_EDGE_S2_INDICATOR_RESEARCH
    outputs:
      smoke_ok: ${{ steps.smoke.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: SPOT_EDGE_S2_INDICATOR_RESEARCH/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Log version/date
        run: |
          echo "Commit: ${{ github.sha }}"
          echo "Fecha de ejecucion (UTC): $(date -u)"
          python --version

      - name: Run full unit test suite (S2 + S2.1)
        run: pytest tests/ -v

      - name: Smoke test con pocos simbolos (Fase A, horizonte corto)
        id: smoke
        run: >
          python spot_edge_s21_research.py
          --phase A
          --symbols BTCUSDT,ETHUSDT,SOLUSDT
          --timeframes 1h,4h,1d
          --max-runtime-minutes 10
          --results-dir RESULTADOS_SPOT_EDGE_S21_SMOKE

      - name: Upload smoke test artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SPOT_EDGE_S21_SMOKE_TEST
          path: SPOT_EDGE_S2_INDICATOR_RESEARCH/RESULTADOS_SPOT_EDGE_S21_SMOKE/
          if-no-files-found: warn
          retention-days: 30

  full-run-phase-a:
    name: Fase A - periodo original (60 dias, reproduccion)
    needs: smoke-test
    if: needs.smoke-test.outputs.smoke_ok == 'success' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'RUN_FULL_S21'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: SPOT_EDGE_S2_INDICATOR_RESEARCH
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: SPOT_EDGE_S2_INDICATOR_RESEARCH/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SPOT EDGE S2.1 - Fase A
        run: >
          python spot_edge_s21_research.py
          --phase A
          --max-symbols ${{ github.event_name == 'push' && '0' || github.event.inputs.max_symbols || '0' }}
          --max-runtime-minutes ${{ github.event.inputs.max_runtime_minutes || '330' }}

      - name: Marcar ejecucion incompleta si se alcanzo el limite de tiempo
        if: failure()
        run: echo "::warning::La Fase A puede haberse detenido por limite de tiempo. Revisar SUMMARY_S21.json (ejecucion_incompleta)."

      - name: Upload resultados Fase A
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RESULTADOS_SPOT_EDGE_S21_FASE_A
          path: SPOT_EDGE_S2_INDICATOR_RESEARCH/RESULTADOS_SPOT_EDGE_S21/
          if-no-files-found: warn
          retention-days: 90

  full-run-phase-b:
    name: Fase B - periodo historico adicional (fuera de muestra)
    needs: smoke-test
    if: needs.smoke-test.outputs.smoke_ok == 'success' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, 'RUN_FULL_S21')) && (github.event.inputs.run_phase_b || 'true') == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        working-directory: SPOT_EDGE_S2_INDICATOR_RESEARCH
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: SPOT_EDGE_S2_INDICATOR_RESEARCH/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run SPOT EDGE S2.1 - Fase B
        run: >
          python spot_edge_s21_research.py
          --phase B
          --max-symbols ${{ github.event.inputs.max_symbols || '0' }}
          --max-runtime-minutes ${{ github.event.inputs.max_runtime_minutes || '330' }}

      - name: Upload resultados Fase B
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RESULTADOS_SPOT_EDGE_S21_FASE_B
          path: SPOT_EDGE_S2_INDICATOR_RESEARCH/RESULTADOS_SPOT_EDGE_S21_PHASE_B/
          if-no-files-found: warn
          retention-days: 90

  compare-phases:
    name: Comparar Fase A vs Fase B (validacion cronologica)
    needs: [full-run-phase-a, full-run-phase-b]
    if: always() && needs.full-run-phase-a.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: SPOT_EDGE_S2_INDICATOR_RESEARCH
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pandas
        run: pip install pandas

      - name: Download resultados Fase A
        uses: actions/download-artifact@v4
        with:
          name: RESULTADOS_SPOT_EDGE_S21_FASE_A
          path: SPOT_EDGE_S2_INDICATOR_RESEARCH/RESULTADOS_SPOT_EDGE_S21

      - name: Download resultados Fase B
        if: needs.full-run-phase-b.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: RESULTADOS_SPOT_EDGE_S21_FASE_B
          path: SPOT_EDGE_S2_INDICATOR_RESEARCH/RESULTADOS_SPOT_EDGE_S21_PHASE_B

      - name: Comparar fases
        run: python scripts/compare_phases.py --phase-a-dir RESULTADOS_SPOT_EDGE_S21 --phase-b-dir RESULTADOS_SPOT_EDGE_S21_PHASE_B

      - name: Upload validacion cronologica actualizada
        uses: actions/upload-artifact@v4
        with:
          name: RESULTADOS_SPOT_EDGE_S21_VALIDACION_CRONOLOGICA
          path: SPOT_EDGE_S2_INDICATOR_RESEARCH/RESULTADOS_SPOT_EDGE_S21/CHRONOLOGICAL_VALIDATION.csv
          retention-days: 90
